<!-- ====== FORMULARIO DE CONTACTO ====== -->
<section class="section">
    <div class="container">
        <div class="section-title reveal">
            <span>CONTÁCTANOS</span>
            <h2>Envíanos tu información</h2>
            <p>Escribe tu nombre y correo, y llegará a nuestro canal de Discord.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <form id="formContacto" class="p-4 border rounded-3 bg-dark text-light">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">👤 Tu Nombre</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre" required>
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">📧 Tu Correo</label>
                        <input type="email" class="form-control" id="correo" placeholder="tu@correo.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="mensaje" class="form-label">💬 Mensaje</label>
                        <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-send"></i> Enviar a Discord
                    </button>
                </form>

                <!-- Caja de mensaje de éxito/error -->
                <div id="resultado" class="mt-3 alert d-none text-center"></div>
            </div>
        </div>
    </div>
</section>

<script>
// https://discord.com/api/webhooks/1558109119259480226/wbZwk8zXHB99Vts2l6KYPtoo21O7PFKI_dRQUpz5aFYoDN_pxkrTRtaXl4LfyyIipesA
const WEBHOOK_URL = "https://discord.com/api/webhooks/1558109119259480226/wbZwk8zXHB99Vts2l6KYPtoo21O7PFKI_dRQUpz5aFYoDN_pxkrTRtaXl4LfyyIipesA";

const form = document.getElementById('formContacto');
const resultado = document.getElementById('resultado');

form.addEventListener('submit', async function(e) {
    e.preventDefault();

    // Leer los datos del formulario
    const nombre = document.getElementById('nombre').value;
    const correo = document.getElementById('correo').value;
    const mensaje = document.getElementById('mensaje').value;

    // Mostrar "enviando..."
    resultado.classList.remove('d-none');
    resultado.className = "mt-3 alert alert-info text-center";
    resultado.textContent = "📤 Enviando tu mensaje...";

    try {
        // Enviar a Discord
        const respuesta = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                embeds: [{
                    title: "📩 Nuevo mensaje recibido",
                    color: 39423, // Color verde
                    fields: [
                        { name: "👤 Nombre", value: nombre, inline: false },
                        { name: "📧 Correo", value: correo, inline: false },
                        { name: "💬 Mensaje", value: mensaje, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            })
        });

        if (respuesta.ok) {
            // ✅ Éxito
            resultado.className = "mt-3 alert alert-success text-center";
            resultado.innerHTML = `✅ ¡Mensaje enviado con éxito!<br>Gracias, <strong>${nombre}</strong>. Te responderemos pronto.`;
            form.reset(); // Limpiar formulario
        } else {
            throw new Error("Error en el servidor");
        }
    } catch (error) {
        // ❌ Error
        resultado.className = "mt-3 alert alert-danger text-center";
        resultado.textContent = "❌ No se pudo enviar. Verifica el enlace de Discord.";
    }
});
</script>
